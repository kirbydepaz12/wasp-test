# Docker self-hosting is independent of Cloudflare production.
# Change MUSIC_FOLDER and UPLOAD_FOLDER in .env or Portainer volume mapping.
services:
  wasp-v16:
    build: .
    image: wasp-v16:staging
    pull_policy: build
    container_name: wasp-v16-staging
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-18080}:80"
      - "${HTTPS_PORT:-18443}:443"
    environment:
      NODE_ENV: production
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      DEFAULT_SNI: ${DEFAULT_SNI:-localhost}
      TLS_ARGS: ${TLS_ARGS:-internal}
      SCANNER_SECRET: ${SCANNER_SECRET:-}
      MUSIC_SCAN_PATHS: /music
      MUSIC_SCAN_INTERVAL: ${MUSIC_SCAN_INTERVAL:-300}
      # Existing WASP peer listening sync; no private-network bridge is required.
      PEER_PLAY_SYNC: ${PEER_PLAY_SYNC:-1}
      # Optional Spotify API credentials used only by the server-side playlist search.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # Persistent 32-byte random secret used to encrypt admin-saved Spotify credentials.
      # When unset Docker can reuse the existing persistent SCANNER_SECRET.
      SPOTIFY_SETTINGS_KEY: ${SPOTIFY_SETTINGS_KEY:-}
      # Opt-in weekly MusicBrainz index updates; first download is manual.
      WASP_OFFLINE_AUTO_UPDATE: ${WASP_OFFLINE_AUTO_UPDATE:-0}
      METADATA_SETTINGS_KEY: ${METADATA_SETTINGS_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      # Optional canonical-origin -> configured Tailscale bridge URL mapping.
      PEER_RELAY_ALIASES: ${PEER_RELAY_ALIASES:-}
    volumes:
      - wasp-v16-local-state:/app/.wrangler/state
      - ${MUSIC_FOLDER:-./music}:/music:ro
      - ${UPLOAD_FOLDER:-./uploads}:/data/uploads
      - wasp-v16-caddy-data:/data
      - wasp-v16-caddy-config:/config
      - ${CERT_DIR:-./certs}:/certs:ro
volumes:
  wasp-v16-local-state:
  wasp-v16-caddy-data:
  wasp-v16-caddy-config:
